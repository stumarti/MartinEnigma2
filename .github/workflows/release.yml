name: Halo packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      base_image_url:
        description: "openATV image zip to start from (blank = newest 8.0 for the box)"
        required: false
        default: ""

permissions:
  contents: write

defaults:
  run:
    shell: bash  # bash -eo pipefail, so a failure inside a pipe fails the step

jobs:
  engine:
    # The animation patch must keep applying to openATV 8.0 and compiling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the patch to openATV 8.0
        run: |
          git clone --depth 1 -b 8.0 https://github.com/openatv/enigma2.git /tmp/enigma2
          cd /tmp/enigma2
          git apply -v "$GITHUB_WORKSPACE"/meta-halo/recipes-halo/enigma2/files/*.patch
      - name: Compile-check the engine
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libsigc++-3.0-dev python3-dev
          cd /tmp/enigma2 && touch /tmp/config.h
          for f in lib/gui/ewidgetanimation.cpp lib/gui/ewidget.cpp lib/gui/ewidgetdesktop.cpp; do
            g++ -std=c++17 -fsyntax-only -I/tmp -I. -Iinclude -Ilib \
              $(python3-config --includes) $(pkg-config --cflags sigc++-3.0) "$f"
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # v0.2.0 is a release; v0.2.0-anything (e.g. v0.2.0-test1) is a pre-release.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "${TAG_VERSION%%-*}" = "$(tr -d '[:space:]' < VERSION)" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - name: Build packages
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python tools/build_ipk.py --repo "$GITHUB_REPOSITORY" --out out

      - uses: actions/upload-artifact@v4
        with:
          name: halo-packages
          path: out/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/*.ipk out/SHA256SUMS --clobber
          else
            # Pre-releases (tags with a "-") are ignored by the box's updater.
            PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" out/*.ipk out/SHA256SUMS $PRE \
              --title "Halo ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  image:
    # A Halo image made from the official openATV image: no Yocto build, so it
    # fits on a free GitHub runner in a few minutes.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MACHINE: zgemmah7
      SERIES: "8.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: halo-packages
          path: out

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q lbzip2

      - name: Fetch the openATV base image
        env:
          BASE_URL: ${{ github.event.inputs.base_image_url }}
        run: |
          python3 tools/fetch_base_image.py --machine "$MACHINE" --series "$SERIES" \
            ${BASE_URL:+--url "$BASE_URL"} --out base.zip | tee base-image.txt

      - name: Build the Halo image
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          OUT="image-out/halo-image-$VERSION-$MACHINE.zip"
          sudo python3 tools/remaster.py --base base.zip --packages out/*.ipk \
            --remove image/remove.txt --version "$VERSION" --out "$OUT" | tee remaster.log
          sudo chown -R "$(id -u):$(id -g)" image-out
          ( cd image-out && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256" )
          { echo "Base image: $(cat base-image.txt)"; echo; echo '```'; cat remaster.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: halo-image
          path: image-out/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" image-out/* --clobber
