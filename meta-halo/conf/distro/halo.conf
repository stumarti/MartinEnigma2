#@TYPE: Distribution
#@NAME: Halo
#@DESCRIPTION: Minimal Enigma2 image built on openATV, with the Halo interface

# Start from openATV and override what Halo changes. Keeping "openatv" in
# DISTROOVERRIDES means every openATV-specific fix in OE-Alliance still applies.
require conf/distro/openatv.conf

DISTRO_NAME = "halo"
DISPLAY_DISTRO = "Halo"
DISTRO_VERSION = "0.1"
DISTROOVERRIDES = "openatv:halo"

MAINTAINER = "Halo"
HOMEPAGE = "https://github.com/${HALO_GITHUB_REPO}"
KBUILD_BUILD_USER = "halo"
KBUILD_BUILD_HOST = "halo"
DEFAULT_TIMEZONE = "Europe/Dublin"

# GitHub repository that publishes Halo releases (owner/name).
# Override in local.conf or with: export HALO_GITHUB_REPO=you/halo
HALO_GITHUB_REPO ??= "OWNER/halo"

# Enigma2: openATV's 8.0 release branch. The Halo animation patch is added by
# recipes-halo/enigma2/enigma2.bbappend.
ENIGMA2_URI = "git://github.com/openatv/enigma2.git;protocol=https;branch=8.0"

# Keep MetrixHD installed as a fallback GUI while Halo is young. Halo itself is
# made the active skin by its package (see enigma2-plugin-skins-halo).
E2DEFAULTSKIN = "enigma2-plugin-skins-metrix-atv"

# No openATV feeds: Halo updates come from GitHub Releases (see the Halo plugin).
DISTRO_FEED_URI = "https://github.com/${HALO_GITHUB_REPO}/releases"
STATIC_DISTRO_FEED_URI = "https://github.com/${HALO_GITHUB_REPO}/releases"
DISTRO_FEED_PREFIX = "halo"
