# Halo layer for the OE-Alliance build environment.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "halo-layer"
BBFILE_PATTERN_halo-layer := "^${LAYERDIR}/"
# Above meta-oe-alliance (7), below meta-local (100).
BBFILE_PRIORITY_halo-layer = "50"

LAYERDEPENDS_halo-layer = "oe-alliance-layer"
LAYERSERIES_COMPAT_halo-layer = "wrynose blacksail"

# Root of the Halo repository (the folder above meta-halo).
HALO_SRC := "${@os.path.abspath(os.path.join(d.getVar('LAYERDIR'), '..', 'src'))}"
